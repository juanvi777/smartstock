<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartStock</title>

<link rel="stylesheet" href="css/style.css">
<script defer src="js/dashboard.js"></script>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">

    <!-- IZQUIERDA -->
    <div class="navbar-left">

        <!-- LOGO -->
        <div class="logo-navbar">
            <img src="img/logo.png" alt="logo">
        </div>

    </div>

    <!-- CENTRO -->
    <h1 id="nombreTienda" class="titulo-centro">
        Mi tienda
    </h1>

    <!-- DERECHA -->
    <div class="navbar-right">

        <!-- MENU -->
        <button class="btn-menu-mini" onclick="toggleMenu()">
            ☰
        </button>

    </div>

</header>

<!-- MENU FLOTANTE -->
<div id="menu" class="menu oculto">

    <button onclick="window.location.href='dashboard.html'">
        🛒 Principal
    </button>

    <button onclick="window.location.href='inventario.html'">
        📦 Inventario
    </button>

    <button onclick="window.location.href='historial.html'">
        📑 Historial de ventas
    </button>

    <button onclick="window.location.href='ia.html'">
        🤖 Smart IA
    </button>

    <button onclick="window.location.href='perfil.html'">
        👤 Perfil
    </button>

    <button onclick="cerrarSesion()" class="btn-logout">
        🚪 Cerrar sesión
    </button>

</div>

<script defer src="js/dashboard.js"></script>
<!-- CONTENIDO -->
<main class="contenido">

<!-- ========================================= -->
<!-- VENTAS -->
<!-- ========================================= -->
<section id="ventas" class="card">

    <h2 class="titulo-seccion">
        Sistema de Ventas
    </h2>

    <!-- CODIGO DE BARRAS -->
    <div>

        <label>
            Escanear código de barras
        </label>

        <input
            type="text"
            id="buscarProducto"
            placeholder="Esperando lector de código..."
            autofocus
        >

        <input
            type="number"
            id="cantidadVenta"
            placeholder="Cantidad"
        >

    </div>

    <!-- BOTONES -->
<div class="acciones-venta">

    <button onclick="activarScanner()">
        📡 Escanear código de barras
    </button>

    <button onclick="abrirBusquedaManual()">
        🔍 Buscar manual
    </button>

</div>

<!-- SCANNER -->
<div id="scannerBox" class="scanner-box oculto">

    <h3>📡 Esperando código de barras...</h3>

    <input 
    type="text"
    id="buscarProducto"
    placeholder="Escanea aquí automáticamente">

    <input 
    type="number"
    id="cantidadVenta"
    placeholder="Cantidad"
    value="1"
    min="1">

    <button onclick="agregarPorCodigoBarras()">
        ➕ Agregar producto
    </button>

</div>

    <!-- TABLA -->
    <table class="tabla-venta">

        <thead>

            <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Valor</th>
                <th>Subtotal</th>
                <th></th>
            </tr>

        </thead>

        <tbody id="listaVenta"></tbody>

    </table>

    <h2 id="totalVenta">
        TOTAL: $0
    </h2>

    <button
        class="btn-finalizar"
        onclick="finalizarVenta()"
    >
        FINALIZAR VENTA
    </button>

</section>

<!-- ========================================= -->
<!-- INVENTARIO -->
<!-- ========================================= -->
<section id="inventario" class="card oculto">

    <h2 class="titulo-seccion">
        Inventario
    </h2>

    <button
        class="btn-principal"
        onclick="mostrarFormulario()"
    >
        ➕ Registrar producto
    </button>

    <!-- FORMULARIO -->
    <div id="formProducto" class="oculto">

        <input type="text" id="idProd" placeholder="ID">

        <input type="text" id="codigo" placeholder="Código de barras">

        <input type="text" id="nombre" placeholder="Nombre producto">

        <input type="number" id="costo" placeholder="Costo">

        <input type="number" id="valor" placeholder="Precio venta">

        <button
            class="btn-finalizar"
            onclick="agregarProducto()"
        >
            Guardar producto
        </button>

    </div>

    <!-- TABLA INVENTARIO -->
    <table class="tabla-venta">

        <thead>

            <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Nombre</th>
                <th>Costo</th>
                <th>Precio</th>
                <th>Stock</th>
            </tr>

        </thead>

        <tbody id="tablaProductos"></tbody>

    </table>

</section>

<!-- ========================================= -->
<!-- HISTORIAL -->
<!-- ========================================= -->
<section id="historial" class="card oculto">

    <h2 class="titulo-seccion">
        Historial de ventas
    </h2>

    <div id="historialVentas"></div>

</section>

<!-- ========================================= -->
<!-- SMART IA -->
<!-- ========================================= -->
<section id="ia" class="card oculto">

    <h2 class="titulo-seccion">
        Smart IA
    </h2>

    <div id="robot">
        🤖
    </div>

    <div
        id="chatBox"
        style="
        height:300px;
        overflow-y:auto;
        margin-top:20px;
        "
    ></div>

    <input
        type="text"
        id="pregunta"
        placeholder="Pregúntale algo a Smart IA..."
    >

    <button
        class="btn-finalizar"
        onclick="responder()"
    >
        Enviar
    </button>

</section>

<!-- ========================================= -->
<!-- PERFIL -->
<!-- ========================================= -->
<section id="perfil" class="card oculto">

    <h2 class="titulo-seccion">
        Perfil
    </h2>

    <input type="text" placeholder="Nombre">

    <input type="email" placeholder="Correo">

    <input type="password" placeholder="Nueva contraseña">

    <button class="btn-finalizar">
        Guardar cambios
    </button>

</section>

</main>

<!-- ========================================= -->
<!-- MODAL FACTURA -->
<!-- ========================================= -->
<div id="modalFactura" class="modal">

    <div class="modal-contenido">

        <h2>
            Factura de venta
        </h2>

        <p id="fechaFactura"></p>

        <table class="tabla-venta">

            <thead>

                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Total</th>
                </tr>

            </thead>

            <tbody id="detalleFactura"></tbody>

        </table>

        <h2 id="totalFactura"></h2>

        <button
            class="btn-finalizar"
            onclick="cerrarModal()"
        >
            Cerrar
        </button>

    </div>

</div>

<!-- ========================================= -->
<!-- MODAL BUSQUEDA MANUAL -->
<!-- ========================================= -->
<div id="modalBusqueda" class="modal">

    <div class="modal-contenido">

        <h2>
            Buscar producto
        </h2>

        <select id="tipoBusqueda">

            <option value="nombre">
                Buscar por nombre
            </option>

            <option value="id">
                Buscar por ID
            </option>

        </select>

        <input
            type="text"
            id="textoBusqueda"
            placeholder="Escribe para buscar..."
        >

        <button
            class="btn-principal"
            onclick="buscarProductoManual()"
        >
            Buscar
        </button>

        <div id="resultadoBusqueda"></div>

        <button
            class="btn-finalizar"
            onclick="cerrarBusquedaManual()"
        >
            Cerrar
        </button>

    </div>

</div>

</body>
</html>
